<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Óptica Mantilla - Autenticación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link rel="stylesheet" href="CSS/estilos.css">
</head>

<body class="bg-light">

    <!-- VISTA LOGIN -->
    <div id="vistaLogin" class="d-flex align-items-center justify-content-center min-vh-100 p-3">
        <div class="card border-0 shadow-lg p-4 animate__animated animate__fadeIn"
            style="width: 100%; max-width: 420px; border-radius: 16px;">

            <div class="text-center mb-4">
                <div class="mb-3">
                    <img src="ASSETS/IMG/optica_mantilla.png" alt="Logo" class="img-fluid"
                        style="max-height: 290px; object-fit: contain;">
                </div>
                <h3 class="fw-bold text-dark mb-1">Óptica Mantilla</h3>
                <p class="text-muted small">Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <div id="alertContainer" class="mb-3"></div>

            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required
                        style="border-radius: 10px;">
                    <label for="email"><i class="bi bi-envelope me-2 text-muted"></i>Correo Electrónico</label>
                </div>

                <div class="input-group mb-4" style="border-radius: 10px; overflow: hidden;">
                    <div class="form-floating flex-grow-1">
                        <input type="password" class="form-control" id="password" placeholder="Contraseña" required
                            style="border-radius: 10px 0 0 10px;">
                        <label for="password"><i class="bi bi-lock me-2 text-muted"></i>Contraseña</label>
                    </div>
                    <button class="btn btn-outline-secondary border" type="button" id="togglePassword"
                        style="border-radius: 0 10px 10px 0; background-color: #fff; border-left: none !important;">
                        <i class="bi bi-eye text-muted" id="eyeIcon"></i>
                    </button>
                </div>

                <button class="btn btn-primary w-100 py-3 fw-bold shadow-sm" type="submit"
                    style="border-radius: 10px; transition: all 0.3s ease;">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL APERTURA DE CAJA (Se abre después del Login exitoso) -->
    <div class="modal fade" id="modalAperturaCaja" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-header border-0 bg-success text-white py-3" style="border-radius: 16px 16px 0 0;">
                    <h5 class="modal-title fw-bold mx-auto">
                        <i class="bi bi-cash-stack me-2"></i>Apertura de Caja
                    </h5>
                </div>
                <div class="modal-body p-4 text-center">
                    <p class="text-muted mb-3">Bienvenido al sistema. Para comenzar, ingrese el monto inicial en efectivo.</p>
                    
                    <div class="input-group input-group-lg mb-3 mx-auto" style="max-width: 300px;">
                        <span class="input-group-text bg-light fw-bold">S/</span>
                        <input type="number" id="montoAperturaCaja" class="form-control text-center fw-bold" placeholder="0.00" step="0.01" min="0" value="0.00">
                    </div>
                </div>
                <div class="modal-footer border-0 bg-light py-3 justify-content-center" style="border-radius: 0 0 16px 16px;">
                    <button type="button" class="btn btn-success px-5 fw-bold" id="btnConfirmarApertura" style="border-radius: 8px;">
                        <i class="bi bi-check-lg me-1"></i> Abrir Caja
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- VISTA APLICACIÓN -->
    <div id="appContainer" class="d-none min-vh-100 bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-3 py-2 sticky-top">
            <div class="container-fluid">
                <!-- LOGO INTEGRADO AQUÍ -->
                <a class="navbar-brand fw-bold d-flex align-items-center" href="#" onclick="cargarModulo()">
                    <img src="ASSETS/IMG/optica_mantilla.png" alt="Logo" 
                         style="height: 50px; margin-right: 18px; border-radius: 6px;">
                    Óptica Mantilla
                </a>
                
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navDashboard">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navDashboard">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 mt-2 mt-lg-0">
                        <li class="nav-item"><a class="nav-link rounded px-3" href="#" onclick="cargarModulo()"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3" href="#" onclick="cargarModuloVentas()"><i class="bi bi-cart me-1"></i> Ventas</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3" href="#" onclick="cargarModuloClientes()"><i class="bi bi-people me-1"></i> Clientes</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3" href="#" onclick="cargarModuloAlmacen()"><i class="bi bi-box-seam me-1"></i> Almacén</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3" href="#" onclick="cargarModuloCitas()"><i class="bi bi-calendar-event me-1"></i> Citas</a></li>
                        <li class="nav-item"><a class="nav-link rounded px-3" href="#" onclick="cargarModuloUsuarios()"><i class="bi bi-person-gear me-1"></i> Usuarios</a></li>
                    </ul>
                    <div class="d-flex align-items-center pt-2 pt-lg-0 border-top border-secondary border-lg-0">
                        <span class="text-light opacity-75 me-3 small"><i class="bi bi-person-circle me-1"></i> Gustavo</span>
                        <button id="btnSalir" class="btn btn-sm btn-outline-danger px-3" style="border-radius: 6px;"><i class="bi bi-box-arrow-left me-1"></i> Salir</button>
                    </div>
                </div>
            </div>
        </nav>
        <div class="container-fluid p-4">
            <main id="contenidoDinamico"></main>
        </div>
    </div>

    <!-- Firebase SDKs -->
     <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Bootstrap JS (bundle incluye Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts del Sistema -->
    <script src="JS/conexion.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/ventas.js"></script>
    <script src="JS/dashboard.js"></script>
    <script src="JS/cliente.js"></script>
    <script src="JS/inventario.js"></script>
    <script src="JS/citas.js"></script>
    <script src="JS/usuarios.js"></script>
</body>
</html>
